spring.application.name=hckt
spring.config.import=optional:file:../.env[.properties]
server.address=127.0.0.1
server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/hckt}
spring.datasource.username=${DB_USER:hckt}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB
server.error.include-message=never
server.error.include-stacktrace=never
app.ollama.url=${OLLAMA_URL:http://127.0.0.1:11434}
app.ollama.model=${OLLAMA_MODEL:qwen3.5:4b}
